        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dlvjwpwte
      - key: CLOUDINARY_API_KEY
        value: "693929685976346"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
